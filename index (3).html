<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Registry</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --bg:#070a10; --panel:#0e141f; --panel2:#131b29;
    --line:rgba(140,180,225,.14); --line2:rgba(140,180,225,.28);
    --txt:#e6edf6; --dim:#8b9bb2;
    --acc:#38b6ff; --acc2:#9ad9ff;
    --acc-soft:rgba(56,182,255,.13); --glow:rgba(56,182,255,.22);
    --ok:#3fbf7f; --danger:#ef6a5e; --warn:#f2b134;
  }
  /* ── RSCC corporate blue (Chronoshii) ── */
  [data-theme="kate"]{
    --acc:#38b6ff; --acc2:#9ad9ff;
    --acc-soft:rgba(56,182,255,.13); --glow:rgba(56,182,255,.22);
    --panel:#0e141f; --panel2:#131b29;
  }
  /* ── NEXA crimson (Shuzika) ── */
  [data-theme="shuzika"]{
    --acc:#e02b3c; --acc2:#ff6a72;
    --acc-soft:rgba(224,43,60,.13); --glow:rgba(224,43,60,.22);
    --panel:#161013; --panel2:#1f151a;
    --line:rgba(235,180,190,.13); --line2:rgba(235,180,190,.28);
  }
  /* ── RSCC-Black clearance violet (Schungzie) ── */
  [data-theme="schungzie"]{
    --acc:#a855f7; --acc2:#d8b4fe;
    --acc-soft:rgba(168,85,247,.14); --glow:rgba(168,85,247,.22);
    --panel:#12101d; --panel2:#191527;
    --line:rgba(190,165,225,.15); --line2:rgba(190,165,225,.3);
  }
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--txt);font-family:var(--sans);
    font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased;
    display:flex;overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.45;
    background:
      linear-gradient(rgba(56,182,255,.025) 1px,transparent 1px) 0 0/100% 3px,
      radial-gradient(circle at 18% 12%,rgba(56,182,255,.07),transparent 42%);
  }

  /* ══════ SIDEBAR ══════ */
  .side{
    width:272px;flex:0 0 272px;height:100vh;background:#090d14;
    border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;
  }
  .brand{padding:20px 18px 16px;border-bottom:1px solid var(--line);}
  .brand .t{font-size:15px;font-weight:800;letter-spacing:.02em;line-height:1.25;}
  .brand .t b{color:var(--acc);}
  .brand .s{
    font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--dim);
    margin-top:7px;line-height:1.4;
  }
  .rlabel{
    font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:var(--dim);
    text-transform:uppercase;padding:16px 18px 9px;
  }
  .roster{flex:1;overflow-y:auto;padding:0 12px;}
  .op{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
    background:transparent;border:1px solid transparent;border-radius:10px;
    padding:9px 10px;margin-bottom:5px;color:inherit;font:inherit;
    transition:background .16s,border-color .16s,transform .16s;
  }
  .op:hover{background:rgba(255,255,255,.04);border-color:var(--line);}
  .op.active{background:var(--acc-soft);border-color:var(--acc);}
  .op .av{
    display:block;flex:0 0 40px;width:40px;height:40px;border-radius:8px;overflow:hidden;
    background:#0c1017;border:1px solid var(--line);
  }
  .op .av img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;}
  .op .meta{display:block;min-width:0;flex:1;}
  .op .nm{
    display:block;font-size:13.5px;font-weight:700;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .op .fx{
    display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;
    color:var(--dim);text-transform:uppercase;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .op .st{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:var(--dim);}
  .op .st.ok{background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .op .st.unk{background:#5a6478;}
  .op .st.hi{background:var(--danger);box-shadow:0 0 8px var(--danger);}

  /* mini player */
  .player{border-top:1px solid var(--line);padding:12px 14px 13px;}
  .prow{display:flex;align-items:center;gap:9px;}
  #muteBtn{
    flex:0 0 28px;width:28px;height:28px;border-radius:7px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--acc);
    font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  #muteBtn:hover{background:var(--acc-soft);}
  #volSlider{flex:1;height:3px;-webkit-appearance:none;appearance:none;
    background:rgba(255,255,255,.14);border-radius:3px;outline:none;cursor:pointer;}
  #volSlider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
    border-radius:50%;background:var(--acc);cursor:pointer;}
  #volSlider::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;
    background:var(--acc);cursor:pointer;}
  .ftxt{
    font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ftxt.on{color:var(--acc);} .ftxt.warn{color:var(--warn);}

  #burger{
    display:none;position:fixed;top:12px;left:12px;z-index:60;width:40px;height:40px;
    border-radius:9px;background:#0e141f;border:1px solid var(--line2);color:var(--txt);
    font-size:16px;cursor:pointer;align-items:center;justify-content:center;
  }
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:38;}

  /* ══════ MAIN ══════ */
  .main{flex:1;height:100vh;overflow-y:auto;position:relative;z-index:2;}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 26px 70px;}

  /* home */
  .home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 26px;}
  .home h1{
    font-size:clamp(24px,4.4vw,44px);font-weight:820;line-height:1.14;letter-spacing:-.5px;
    max-width:22ch;
  }
  .home h1 .h2line{color:var(--acc);}
  .home .sub{
    font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--dim);
    text-transform:uppercase;margin-top:14px;
  }
  .home .rule{width:72px;height:2px;background:var(--acc);margin:22px auto 0;opacity:.8;}
  .picks{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:26px;}
  .pick{
    width:212px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
    overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0;
    transition:transform .18s,border-color .18s,box-shadow .18s;
  }
  .pick:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 30px rgba(0,0,0,.5);}
  .pick .ph{display:block;height:150px;overflow:hidden;background:#0c1017;position:relative;}
  .pick .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;}
  .pick .ph::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 40%,var(--panel));}
  .pick .bd{display:block;padding:12px 14px 14px;}
  .pick .bd .n{display:block;font-size:15px;font-weight:750;line-height:1.2;}
  .pick .bd .f{
    display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;
    color:var(--dim);text-transform:uppercase;margin-top:6px;line-height:1.5;
  }

  /* ══════ LOADER ══════ */
  .loader{
    position:fixed;inset:0;z-index:100;display:none;
    align-items:center;justify-content:center;flex-direction:column;background:#05070a;
  }
  .loader.on{display:flex;}
  .loader.out{animation:fadeout .42s ease forwards;}
  @keyframes fadeout{to{opacity:0;visibility:hidden}}
  .loader .sheen{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 45%,var(--glow),transparent 58%);}
  .loader .scan{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.4) 3px 4px);}
  .lmark{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:220px;height:220px;margin-bottom:34px;
    animation:markin .8s cubic-bezier(.2,1,.3,1) both;
  }
  @keyframes markin{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
  .lmark img{max-width:100%;max-height:100%;display:block;object-fit:contain;
    filter:drop-shadow(0 0 26px var(--glow));}
  .lmark .ring{position:absolute;inset:-14px;border:1px solid var(--line2);border-radius:50%;
    border-top-color:var(--acc);animation:spin 1.5s linear infinite;}

  /* ── disavowed / revoked affiliation overlay on the faction mark ── */
  .lmark.disavowed img{
    filter:drop-shadow(0 0 26px var(--glow)) grayscale(.78) contrast(.82);opacity:.45;
  }
  .lmark .stampbar{
    position:absolute;left:-9%;right:-9%;top:43%;height:17%;
    background:#000;border:1px solid rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11px;letter-spacing:.26em;color:var(--danger);
    text-transform:uppercase;font-weight:700;transform:rotate(-4deg);
    box-shadow:0 6px 22px rgba(0,0,0,.6);
  }
  .lmark .noise{
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 2px,transparent 2px 5px);
    animation:jitter .18s steps(2) infinite;
  }
  @keyframes jitter{50%{transform:translateY(-2px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lname{
    font-family:var(--mono);font-size:14px;letter-spacing:.4em;text-transform:uppercase;
    color:var(--txt);font-weight:700;text-align:center;
    animation:markin .8s .12s cubic-bezier(.2,1,.3,1) both;
  }
  .lsub{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--dim);margin-top:9px;text-align:center;
    animation:markin .8s .2s cubic-bezier(.2,1,.3,1) both;
  }
  .lbar{width:min(330px,64vw);height:2px;background:rgba(255,255,255,.1);
    margin-top:30px;overflow:hidden;border-radius:2px;}
  .lbar i{display:block;height:100%;width:0;background:var(--acc);
    box-shadow:0 0 12px var(--acc);animation:fill 1.5s cubic-bezier(.5,.05,.2,1) forwards;}
  @keyframes fill{to{width:100%}}
  .lstat{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--dim);margin-top:12px;min-height:14px;}

  /* ══════ PROFILE ══════ */
  .fadein{animation:fin .5s ease both;}
  @keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .topbar{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--dim);padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);
  }
  .topbar .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 9px var(--acc);}
  .topbar .sep{opacity:.32;}
  .topbar .right{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .topbar b{color:var(--txt);font-weight:700;}
  .topbar b.alive{color:var(--ok);} .topbar b.unk{color:var(--dim);}

  header.hero{
    position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    background:linear-gradient(120deg,var(--panel) 0%,var(--panel2) 52%,var(--panel) 100%);
    padding:28px 30px 0;margin-bottom:18px;
  }
  header.hero::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;
    background:linear-gradient(180deg,var(--acc),var(--acc2) 62%,transparent);}
  header.hero::after{content:"";position:absolute;right:-90px;top:-80px;width:440px;height:440px;
    border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 66%);pointer-events:none;}
  .hero-in{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;}
  .hero-tx{flex:1 1 360px;min-width:280px;padding-bottom:28px;}
  .codename{font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:var(--acc);
    text-transform:uppercase;margin-bottom:9px;}
  h1.nm{margin:0;font-size:clamp(24px,3.8vw,37px);line-height:1.08;font-weight:780;letter-spacing:-.5px;}
  h1.nm .al{display:block;font-size:.46em;font-weight:600;color:var(--acc2);margin-top:8px;}
  .tagline{margin:15px 0 0;color:var(--dim);max-width:52ch;font-size:14.5px;
    border-left:2px solid var(--line2);padding-left:14px;}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px;}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 11px;border-radius:100px;border:1px solid var(--line2);
    color:var(--dim);background:rgba(255,255,255,.02);}
  .chip.acc{color:var(--acc);border-color:var(--acc);background:var(--acc-soft);}
  .chip.acc2{color:var(--acc2);border-color:var(--acc2);background:rgba(255,255,255,.03);}
  .chip.ok{color:var(--ok);border-color:rgba(63,191,127,.4);background:rgba(63,191,127,.1);}
  .chip.dg{color:var(--danger);border-color:rgba(239,106,94,.4);background:rgba(239,106,94,.1);}
  .hero-fig{position:relative;flex:0 0 300px;width:300px;align-self:flex-end;margin:0 0 -1px;}
  .hero-fig img{display:block;width:100%;height:auto;filter:drop-shadow(0 20px 34px rgba(0,0,0,.66));}
  .hero-fig.bleed{margin-right:-30px;}
  .hero-fig .gl{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);
    width:76%;height:58%;border-radius:50%;z-index:-1;
    background:radial-gradient(ellipse,var(--glow),transparent 68%);filter:blur(24px);}

  .vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));
    border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;
    background:var(--panel);}
  .vital{padding:12px 15px;border-right:1px solid var(--line);}
  .vital:last-child{border-right:0;}
  .vital .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--dim);
    text-transform:uppercase;}
  .vital .v{font-size:16px;font-weight:750;margin-top:3px;}
  .vital .v small{font-size:11px;font-weight:500;color:var(--dim);}

  .cols{display:grid;grid-template-columns:1.62fr 1fr;gap:18px;align-items:start;}
  .stack{display:flex;flex-direction:column;gap:18px;min-width:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:20px 22px;}
  .card h2{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--acc);font-weight:700;margin-bottom:14px;
    display:flex;align-items:center;gap:9px;
  }
  .card h2::before{content:"◆";font-size:8px;opacity:.75;}
  .card h2 .n{margin-left:auto;color:var(--dim);font-size:9px;letter-spacing:.2em;font-weight:600;}
  .card p{margin-bottom:11px;color:#cdd8e6;font-size:14.6px;}
  .card p:last-child{margin-bottom:0;}
  .card p strong{color:var(--txt);font-weight:700;}
  .beat{border-left:2px solid var(--acc);padding-left:13px;color:var(--txt)!important;
    font-weight:650;margin:14px 0!important;}

  /* field rows */
  .fields{display:flex;flex-direction:column;gap:9px;}
  .field{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:start;
    padding-bottom:9px;border-bottom:1px dashed var(--line);}
  .field:last-child{border-bottom:0;padding-bottom:0;}
  .field .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;padding-top:3px;}
  .field .v{font-size:14px;color:#cdd8e6;}
  .swatches{display:flex;gap:5px;flex-wrap:wrap;}
  .sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.16);display:block;}

  /* ID photo */
  .idphoto{position:relative;border:1px solid var(--line2);border-radius:10px;overflow:hidden;
    background:#0c1017;}
  .idphoto img{display:block;width:100%;height:auto;}
  .idphoto .scan{position:absolute;inset:0;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.5) 3px 4px);}
  .cn{position:absolute;width:13px;height:13px;border:2px solid var(--acc);}
  .cn.c1{top:7px;left:7px;border-right:0;border-bottom:0;}
  .cn.c2{top:7px;right:7px;border-left:0;border-bottom:0;}
  .cn.c3{bottom:7px;left:7px;border-right:0;border-top:0;}
  .cn.c4{bottom:7px;right:7px;border-left:0;border-top:0;}

  /* stat bars */
  .stat{margin-bottom:12px;} .stat:last-child{margin-bottom:0;}
  .stat .row{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);margin-bottom:5px;}
  .stat .row span:last-child{color:var(--txt);font-weight:700;}
  .bar{height:5px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));}
  .bar i.warn{background:linear-gradient(90deg,#8a5a2b,var(--warn));}
  .bar i.dg{background:linear-gradient(90deg,#7d2d28,var(--danger));}

  /* tags + traits */
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:4px 9px;
    border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);}
  .traits{display:flex;flex-direction:column;gap:0;}
  .trait{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);}
  .trait:last-child{border-bottom:0;}
  .trait .name{flex:0 0 148px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--acc);font-weight:700;}
  .trait .desc{flex:1;font-size:13.8px;color:#cdd8e6;}

  /* note box */
  .note{border:1px solid var(--line2);border-left:3px solid var(--warn);border-radius:9px;
    padding:13px 15px;background:rgba(242,177,52,.05);font-size:13.8px;color:#cdd8e6;}
  .note.acc{border-left-color:var(--acc);background:var(--acc-soft);}
  .note.dg{border-left-color:var(--danger);background:rgba(239,106,94,.06);}
  .note .lbl{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--warn);font-weight:700;margin-bottom:6px;}
  .note.acc .lbl{color:var(--acc);} .note.dg .lbl{color:var(--danger);}

  /* core subcore list */
  .cores{display:flex;flex-direction:column;gap:10px;}
  .core{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:9px;
    border:1px solid var(--line);background:rgba(255,255,255,.02);}
  .core .cd{flex:0 0 12px;width:12px;height:12px;border-radius:50%;margin-top:4px;}
  .core .ct{flex:1;min-width:0;}
  .core .cn2{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;font-weight:700;margin-bottom:3px;}
  .core .cx{display:block;font-size:13.6px;color:#cdd8e6;}

  /* mission log */
  .mission{border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:10px;
    background:rgba(255,255,255,.02);}
  .mission:last-child{margin-bottom:0;}
  .mission .mh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:7px;}
  .mission .mid{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--acc);font-weight:700;}
  .mission .mty{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--dim);
    text-transform:uppercase;}
  .mission .mout{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;font-weight:700;color:var(--ok);}
  .mission .mout.cls{color:var(--danger);}
  .mission .mn{font-size:13.6px;color:#cdd8e6;}

  /* certification grid */
  .certs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 14px;}
  .cert{display:flex;gap:8px;align-items:baseline;font-size:13.4px;color:#cdd8e6;}
  .cert::before{content:"▸";color:var(--acc);font-size:9px;flex:0 0 auto;}

  /* quote block */
  .interview{border:1px solid var(--line2);border-radius:13px;padding:22px 24px;
    background:linear-gradient(135deg,var(--acc-soft),transparent 70%);}
  .interview .q{font-size:17px;font-weight:700;line-height:1.5;color:var(--txt);margin:0;}
  .interview .by{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);
    text-transform:uppercase;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}

  footer{margin-top:22px;padding-top:15px;border-top:1px solid var(--line);
    display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;
    font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);}
  footer .hl{color:var(--acc);}

  .redacted{
    display:inline-block;background:#000;color:transparent;border-radius:3px;
    padding:0 8px;user-select:none;border:1px solid rgba(255,255,255,.12);
    font-family:var(--mono);letter-spacing:.1em;
  }
  .redacted::after{content:"REDACTED";color:rgba(255,255,255,.30);font-size:9px;letter-spacing:.16em;}


  /* ══════ EDIT MODE ══════ */
  /* concealed trigger: invisible hotspot in the sidebar brand corner */
  #editDot{
    position:absolute;top:0;right:0;width:26px;height:26px;cursor:default;
    opacity:0;background:transparent;border:0;padding:0;
  }
  .brand{position:relative;}

  #gate{
    position:fixed;inset:0;z-index:200;display:none;
    align-items:center;justify-content:center;background:rgba(3,5,9,.82);
    backdrop-filter:blur(3px);
  }
  #gate.on{display:flex;}
  .gbox{
    width:min(380px,92vw);background:var(--panel);border:1px solid var(--line2);
    border-radius:14px;padding:24px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.6);
  }
  .gbox h3{
    font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--acc);font-weight:700;margin-bottom:6px;
  }
  .gbox p{font-size:13px;color:var(--dim);margin-bottom:15px;}
  .grow{display:flex;gap:8px;}
  .gbox input{
    flex:1;background:#070a10;border:1px solid var(--line2);border-radius:8px;
    color:var(--txt);font-family:var(--mono);font-size:13px;letter-spacing:.14em;
    padding:10px 12px;outline:none;
  }
  .gbox input:focus{border-color:var(--acc);}
  .gbox button{
    background:var(--acc);color:#04070c;border:0;border-radius:8px;cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    font-weight:700;padding:10px 15px;
  }
  .gmsg{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--danger);margin-top:11px;min-height:13px;}
  .gbox .gx{
    display:block;width:100%;margin-top:12px;background:transparent;color:var(--dim);
    border:1px solid var(--line);
  }
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}
    50%{transform:translateX(-4px)}}
  .shake{animation:shake .4s;}

  /* editing chrome */
  body.editing [contenteditable="true"]{
    outline:1px dashed rgba(56,182,255,.45);outline-offset:2px;border-radius:3px;
  }
  body.editing [contenteditable="true"]:hover{background:rgba(56,182,255,.07);}
  body.editing [contenteditable="true"]:focus{
    outline:1px solid var(--acc);background:rgba(56,182,255,.10);
  }
  #ebar{
    position:fixed;left:0;right:0;bottom:0;z-index:150;display:none;
    align-items:center;gap:10px;flex-wrap:wrap;
    background:#0b1119;border-top:1px solid var(--acc);
    padding:10px 16px;box-shadow:0 -8px 26px rgba(0,0,0,.5);
  }
  #ebar.on{display:flex;}
  #ebar .lab{
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--acc);font-weight:700;
  }
  #ebar .hint{font-size:11.5px;color:var(--dim);}
  #ebar .sp{margin-left:auto;}
  #ebar button{
    background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--txt);
    border-radius:7px;cursor:pointer;padding:7px 13px;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  }
  #ebar button:hover{border-color:var(--acc);color:var(--acc);}
  #ebar .lk{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
    color:var(--dim);border:1px solid var(--line2);border-radius:20px;
    padding:4px 10px;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis;
  }
  #ebar .lk.ok{color:#4ade80;border-color:rgba(74,222,128,.45);}
  #ebar .lk.bad{color:var(--danger);border-color:rgba(255,90,95,.45);}
  #ebar button.pri{background:var(--acc);color:#04070c;border-color:var(--acc);}
  #ebar button.pri:hover{color:#04070c;filter:brightness(1.1);}
  #ebar .saved{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ok);}
  body.editing .main{padding-bottom:60px;}

  @media (max-width:860px){
    #ebar{padding:9px 12px;} #ebar .hint{display:none;}
  }

  @media (max-width:1040px){ .cols{grid-template-columns:1fr;} }
  @media (max-width:860px){
    body{display:block;overflow:auto;}
    #burger{display:flex;}
    .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;}
    .side.open{transform:none;}
    .scrim.on{display:block;}
    .main{height:auto;overflow:visible;}

    .hero-tx{padding-bottom:6px;}
    .trait{flex-direction:column;gap:3px;} .trait .name{flex:none;}
    .field{grid-template-columns:1fr;gap:3px;}
  }

/* ═══════ AUDIO ═══════ */
const Audio_ = { el:null, id:null, fade:null, vol:DEFAULT_VOLUME, muted:false, blocked:false };
const statusEl = $("#musicStatus");

function setStatus(txt, cls){
  statusEl.textContent = txt;
  statusEl.className = "ftxt" + (cls ? " " + cls : "");
}
function applyVolume(){
  if (Audio_.el) Audio_.el.volume = Audio_.muted ? 0 : Audio_.vol;
}
function stopMusic(){
  if (Audio_.fade) { clearInterval(Audio_.fade); Audio_.fade = null; }
  if (Audio_.el) { try { Audio_.el.pause(); } catch(e){} Audio_.el = null; }
  Audio_.id = null;
}
function playMusic(id){
  const src = MUSIC[id];
  if (!src) { stopMusic(); setStatus("No track assigned"); return; }
  if (Audio_.id === id && Audio_.el && !Audio_.el.paused) return;

  const old = Audio_.el;
  if (Audio_.fade) { clearInterval(Audio_.fade); Audio_.fade = null; }

  const a = new Audio(src);
  a.loop = true;
  a.volume = 0;
  Audio_.el = a; Audio_.id = id;

  a.addEventListener("error", () => {
    if (Audio_.el !== a) return;
    setStatus("Missing " + src, "warn");
  });

  const target = Audio_.muted ? 0 : Audio_.vol;
  a.play().then(() => {
    Audio_.blocked = false;
    setStatus(Audio_.muted ? "Music muted" : "Now playing", Audio_.muted ? null : "on");
    const steps = Math.max(1, Math.round(FADE_MS / 50));
    let i = 0;
    Audio_.fade = setInterval(() => {
      i++;
      const t = Math.min(1, i / steps);
      if (Audio_.el === a) a.volume = target * t;
      if (old && !old.paused) old.volume = Math.max(0, (Audio_.muted ? 0 : Audio_.vol) * (1 - t));
      if (t >= 1) {
        clearInterval(Audio_.fade); Audio_.fade = null;
        if (old) { try { old.pause(); } catch(e){} }
      }
    }, 50);
  }).catch(err => {
    if (old) { try { old.pause(); } catch(e){} }
    if (err && err.name === "NotAllowedError") {
      Audio_.blocked = true;
      setStatus("Click anywhere to enable audio", "warn");
    } else {
      setStatus("Missing " + src, "warn");
    }
  });
}
function unblockAudio(){
  if (!Audio_.blocked || !Audio_.el) return;
  Audio_.el.play().then(() => {
    Audio_.blocked = false;
    Audio_.el.volume = Audio_.muted ? 0 : Audio_.vol;
    setStatus(Audio_.muted ? "Music muted" : "Now playing", Audio_.muted ? null : "on");
  }).catch(()=>{});
}
document.addEventListener("pointerdown", unblockAudio, true);
document.addEventListener("keydown", unblockAudio, true);

(function(){
  const slider = $("#volSlider"), btn = $("#muteBtn");
  const sv = localStorage.getItem("al_vol"), sm = localStorage.getItem("al_muted");
  if (sv !== null) Audio_.vol = Math.max(0, Math.min(1, parseFloat(sv)));
  if (sm === "1") Audio_.muted = true;
  slider.value = Math.round(Audio_.vol * 100);
  btn.textContent = Audio_.muted ? "✕" : "♪";
  btn.style.color = Audio_.muted ? "var(--dim)" : "var(--acc)";

  slider.addEventListener("input", () => {
    Audio_.vol = slider.value / 100;
    localStorage.setItem("al_vol", String(Audio_.vol));

      btn.textContent = "♪"; btn.style.color = "var(--acc)"; }
    applyVolume();
    if (Audio_.el && !Audio_.el.paused) setStatus("Now playing","on");
  });
  btn.addEventListener("click", () => {
    Audio_.muted = !Audio_.muted;
    localStorage.setItem("al_muted", Audio_.muted ? "1" : "0");
    btn.textContent = Audio_.muted ? "✕" : "♪";
    btn.style.color = Audio_.muted ? "var(--dim)" : "var(--acc)";
    applyVolume();
    if (Audio_.el && !Audio_.el.paused)
      setStatus(Audio_.muted ? "Music muted" : "Now playing", Audio_.muted ? null : "on");

})();

/* ═══════ LOADER ═══════ */
function runLoader(op, done){
  const f = FACTIONS[op.faction];
  document.body.setAttribute("data-theme", op.theme);

  lmark.className = "lmark" + (f.disavowed ? " disavowed" : "");
  lmark.innerHTML = `<span class="ring"></span><img src="${f.img}" alt="">` +
    (f.disavowed ? `<span class="noise"></span><span class="stampbar">Disavowed</span>` : ``);
  lname.textContent = f.name;
  lsub.textContent  = f.sub;
  lstat.textContent = f.steps[0];

  loader.classList.remove("out");
  loader.classList.add("on");

  setTimeout(() => lstat.textContent = f.steps[1], 620);
  setTimeout(() => lstat.textContent = f.steps[2], 1280);
  setTimeout(() => {
    loader.classList.add("out");
    setTimeout(() => { loader.classList.remove("on","out"); done(); }, 400);
  }, 1650);
}

/* ═══════ SELECT ═══════ */
function select(id){
  if (busy || current === id) { closeSide(); return; }
  const op = OPS.find(o => o.id === id);
  if (!op) return;
  busy = true;
  closeSide();
  playMusic(id);
  runLoader(op, () => {
    current = id;
    document.body.setAttribute("data-theme", op.theme);
    document.querySelectorAll(".op").forEach(b =>
      b.classList.toggle("active", b.dataset.id === id));
    main.innerHTML = `<div class="wrap fadein" data-view="${op.id}">${op.render()}</div>`;
    main.scrollTop = 0;
    refreshEditables();
    busy = false;
  });
}


/* ═══════════════════════════════════════════
   EDIT MODE
   Concealed trigger: click the top-right corner
   of the sidebar brand box 3 times quickly,
   or press  Ctrl + Shift + E.
   Passcode is below — change it if you like.
   ═══════════════════════════════════════════ */
const EDIT_PASS = "metzikate321";
const EDIT_KEY  = "al_edits";

let editing = false, unlocked = false;
const gate = $("#gate"), gbox = $("#gbox"), gpass = $("#gpass"),
      gmsg = $("#gmsg"), ebar = $("#ebar"), esaved = $("#esaved");

/* ── stable path for each editable node, so edits survive re-render ── */
function nodePath(el){
  const view = el.closest("[data-view]");
  if (view){
    const all = view.querySelectorAll("[data-ed]");
    return view.dataset.view + ":" + Array.prototype.indexOf.call(all, el);
  }
  const sb = el.closest(".side");
  const root = sb || document.body;
  const all = root.querySelectorAll("[data-ed]");
  return (sb ? "side" : "doc") + ":" + Array.prototype.indexOf.call(all, el);
}
function seedEdits(){
  const s = document.getElementById("al-seed");
  if (!s) return {};
  try { return JSON.parse(s.textContent || "{}"); } catch(e){ return {}; }
}
function loadEdits(){
  try {
    const raw = localStorage.getItem(EDIT_KEY);
    if (raw !== null) return JSON.parse(raw);
  } catch(e){}
  return seedEdits();
}
function saveEdit(path, html){
  const all = loadEdits();
  all[path] = html;
  localStorage.setItem(EDIT_KEY, JSON.stringify(all));
  esaved.textContent = "Saved";
  clearTimeout(saveEdit._t);
  saveEdit._t = setTimeout(() => esaved.textContent = "", 1400);
  queueFileWrite();
}

/* mark editable leaves + re-apply stored edits after every render */
/* text blocks that may be edited. Inline children (span/strong/small/b/i)
   are fine and stay inside the editable region; only elements that contain
   another BLOCK of text are skipped, so we never nest two editors. */
const ED_SEL = "h1,h2,h3,p,li,td,th,.v,.k,.cert,.tag,.mn,.cx,.cn2,.nm,.al,.n,.sub,.codename,.tagline,.chip,.lab,.desc,.name,.mid,.mty,.mout,.q,.by,.t,.s,footer span";
const BLOCK_CHILD = "h1,h2,h3,p,li,td,th,section,figure,.card,.cols,.stack,.fields,.field,.traits,.trait,.cores,.core,.mission,.certs,.tags,.stat,.vitals,.vital,.chips,.swatches,.idphoto,.note";
function markEditable(root){
  const host = root || document;
  host.querySelectorAll(ED_SEL).forEach(el => {
    if (el.closest("#ebar,#gate,#loader")) return;   // never the chrome
    if (el.querySelector(BLOCK_CHILD)) return;       // would nest an editor
    if (el.closest("[data-ed]")) return;             // already inside one
    if (!el.textContent.trim()) return;
    el.setAttribute("data-ed","");
  });
}
function applyEdits(root){
  const all = loadEdits();
  if (!Object.keys(all).length) return;
  const host = root || document;
  host.querySelectorAll("[data-ed]").forEach(el => {
    const p = nodePath(el);
    if (all[p] !== undefined) el.innerHTML = all[p];
  });
}
function wireEditable(root){
  const host = root || document;
  host.querySelectorAll("[data-ed]").forEach(el => {
    if (el.dataset.wired) return;
    el.dataset.wired = "1";
    el.addEventListener("blur", () => {
      if (!editing) return;
      saveEdit(nodePath(el), el.innerHTML.trim());
    });
    el.addEventListener("keydown", ev => {
      if (ev.key === "Escape") el.blur();
    });
  });
}
function setEditable(on){
  document.querySelectorAll("[data-ed]").forEach(el => {
    if (on) el.setAttribute("contenteditable","true");
    else el.removeAttribute("contenteditable");
  });
}
/* run after any content swap */
function refreshEditables(){
  markEditable(main);   applyEdits(main);   wireEditable(main);
  markEditable(side);   applyEdits(side);   wireEditable(side);
  if (editing) setEditable(true);
}

/* ── gate ── */
function openGate(){
  if (unlocked) { enterEdit(); return; }
  gate.classList.add("on"); gmsg.textContent = ""; gpass.value = "";
  setTimeout(() => gpass.focus(), 40);
}
function closeGate(){ gate.classList.remove("on"); }
function tryPass(){
  if (gpass.value === EDIT_PASS){
    unlocked = true; closeGate(); enterEdit();
  } else {
    gmsg.textContent = "Incorrect passcode";
    gbox.classList.remove("shake"); void gbox.offsetWidth; gbox.classList.add("shake");
    gpass.select();
  }
}
$("#gok").addEventListener("click", tryPass);
gpass.addEventListener("keydown", e => { if (e.key === "Enter") tryPass(); });
$("#gcancel").addEventListener("click", closeGate);
gate.addEventListener("click", e => { if (e.target === gate) closeGate(); });

function enterEdit(){
  editing = true;
  document.body.classList.add("editing");
  ebar.classList.add("on");
  refreshEditables();
  setEditable(true);
}
function exitEdit(){
  editing = false;
  document.body.classList.remove("editing");

  if (fileHandle){ clearTimeout(writeTimer); writeToFile(); }
}
$("#edone").addEventListener("click", exitEdit);

$("#ereset").addEventListener("click", async () => {

/* ═══════════════════════════════════════════
   AUTO-SAVE STRAIGHT INTO THE HTML FILE
   Uses the File System Access API (Chrome/Edge).
   Click "Link File" once, pick this very file,
   and every edit is written back to it.
   ═══════════════════════════════════════════ */
const BOOT_THEME = document.body.getAttribute("data-theme") || "kate";
const FS_DB = "al_fs", FS_STORE = "h", FS_KEY = "handle";
let fileHandle = null, writeTimer = null, writing = false, pending = false;
const elinkst = $("#elinkst");

function linkStatus(msg, cls){
  if (!elinkst) return;
  elinkst.textContent = msg;
  elinkst.className = "lk" + (cls ? " " + cls : "");
}
function fsSupported(){ return typeof window.showOpenFilePicker === "function"; }

function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(FS_DB, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(FS_STORE)) r.result.createObjectStore(FS_STORE); };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
async function idbPut(v){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction(FS_STORE, "readwrite");
    t.objectStore(FS_STORE).put(v, FS_KEY);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
async function idbGet(){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction(FS_STORE, "readonly");
    const q = t.objectStore(FS_STORE).get(FS_KEY);
    q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error);
  });
}

/* a clean, re-openable copy of this page with the edits baked in as a seed */
function buildCleanHTML(){
  const doc = document.documentElement.cloneNode(true);
  doc.querySelectorAll("[contenteditable]").forEach(e => e.removeAttribute("contenteditable"));
  doc.querySelectorAll("[data-ed]").forEach(e => { e.removeAttribute("data-ed"); e.removeAttribute("data-wired"); });
  /* these three are rendered by JS at start-up — never ship a stale copy of them */
  ["#main", "#roster", "#picks"].forEach(sel => {
    const n = doc.querySelector(sel); if (n) n.innerHTML = "";
  });
  const eb = doc.querySelector("#ebar");   if (eb) eb.classList.remove("on");
  const gt = doc.querySelector("#gate");   if (gt) gt.classList.remove("on");
  const ld = doc.querySelector("#loader"); if (ld) ld.classList.remove("on", "done", "out");
  const bd = doc.querySelector("body");
  if (bd){ bd.classList.remove("editing"); bd.setAttribute("data-theme", BOOT_THEME); }
  const stale = doc.querySelector("#al-seed"); if (stale) stale.remove();
  const seed = document.createElement("script");
  seed.id = "al-seed";
  seed.type = "application/json";
  seed.textContent = JSON.stringify(loadEdits()).replace(/<\//g, "<\\/");
  const hd = doc.querySelector("head"); if (hd) hd.appendChild(seed);
  return "<!DOCTYPE html>\n" + doc.outerHTML;
}

async function writeToFile(){
  if (!fileHandle) return false;
  if (writing){ pending = true; return false; }
  writing = true;
  try {
    const perm = await fileHandle.queryPermission({ mode: "readwrite" });
    if (perm !== "granted"){
      linkStatus("Click Link File to re-grant access", "bad");
      writing = false; return false;
    }
    const w = await fileHandle.createWritable();
    await w.write(buildCleanHTML());
    await w.close();
    linkStatus("Saved to " + fileHandle.name, "ok");
    esaved.textContent = "Written to file";
    clearTimeout(saveEdit._t);
    saveEdit._t = setTimeout(() => esaved.textContent = "", 1600);
  } catch(e){
    linkStatus("Write failed: " + ((e && e.name) || e), "bad");
  }
  writing = false;
  if (pending){ pending = false; queueFileWrite(); }
  return true;
}
function queueFileWrite(){
  if (!fileHandle) return;
  clearTimeout(writeTimer);
  writeTimer = setTimeout(writeToFile, 600);
}

async function linkFile(){
  if (!fsSupported()){
    linkStatus("Needs Chrome or Edge — use Export HTML", "bad");
    return;
  }
  try {
    /* already have a handle that only needs re-permission? skip the picker */
    if (fileHandle){
      const p = await fileHandle.requestPermission({ mode: "readwrite" });
      if (p === "granted"){
        linkStatus("Linked: " + fileHandle.name, "ok");
        await writeToFile();
        return;
      }
    }
    const [hnd] = await window.showOpenFilePicker({
      multiple: false,
      types: [{ description: "This HTML file", accept: { "text/html": [".html", ".htm", ".txt"] } }]
    });
    const p = await hnd.requestPermission({ mode: "readwrite" });
    if (p !== "granted"){ linkStatus("Permission denied", "bad"); return; }
    fileHandle = hnd;
    try { await idbPut(hnd); } catch(e){}
    linkStatus("Linked: " + hnd.name, "ok");
    await writeToFile();
  } catch(e){
    if (e && e.name === "AbortError") return;
    linkStatus("Link failed: " + ((e && e.name) || e), "bad");
  }
}
$("#elink").addEventListener("click", linkFile);

(async function restoreLink(){
  if (!fsSupported()){ linkStatus("Auto-save needs Chrome or Edge", "bad"); return; }
  try {
    const hnd = await idbGet();
    if (!hnd){ linkStatus("Not linked"); return; }
    fileHandle = hnd;
    const perm = await hnd.queryPermission({ mode: "readwrite" });
    if (perm === "granted") linkStatus("Linked: " + hnd.name, "ok");
    else linkStatus("Click Link File to reconnect " + hnd.name, "bad");
  } catch(e){ linkStatus("Not linked"); }
})();

/* ── concealed triggers ── */
(function(){
  let taps = 0, timer = null;
  const dot = $("#editDot");
  dot.addEventListener("click", () => {
    taps++;
    clearTimeout(timer);
    timer = setTimeout(() => taps = 0, 900);
    if (taps >= 3){ taps = 0; openGate(); }
  });
  document.addEventListener("keydown", e => {
    if (e.ctrlKey && e.shiftKey && (e.key === "E" || e.key === "e")){
      e.preventDefault(); openGate();
    }
  });
})();

main.innerHTML = homeHTML();
buildPicks();
refreshEditables();
